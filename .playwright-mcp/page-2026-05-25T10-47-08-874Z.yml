  - generic [ref=e518]:
    - generic [ref=e519]:
      - generic [ref=e520]:
        - generic [ref=e521]: Research Overview
        - heading "Why TRUST-Med?" [level=2] [ref=e522]
        - generic [ref=e523]:
          - paragraph [ref=e524]: Medical AI systems now score above the passing threshold on clinical licensing exams — yet large-scale clinical deployment remains elusive. The bottleneck is not model capability. It is the absence of trustworthy, clinician-grounded evaluation evidence.
          - paragraph [ref=e525]: Existing benchmarks are either standardized exam questions disconnected from clinical reality, or single-jurisdiction preference platforms that cannot answer the critical question for global deployment.
          - paragraph [ref=e526]: TRUST-Med addresses these gaps through a federated, multi-site, safety-aware evaluation framework.
      - generic [ref=e528]:
        - generic [ref=e529]: Key Research Contributions
        - generic [ref=e530]:
          - generic [ref=e531]:
            - generic [ref=e532]: RC-1
            - generic [ref=e533]:
              - generic [ref=e534]: Multi-Dimensional Safety Preference Aggregation
              - paragraph [ref=e535]: Five orthogonal evaluation dimensions aggregated via multi-objective Bradley-Terry estimation.
          - generic [ref=e536]:
            - generic [ref=e537]: RC-2
            - generic [ref=e538]:
              - generic [ref=e539]: Cross-Jurisdiction Validity Framework
              - paragraph [ref=e540]: Modeling systematic preference divergence between clinician cohorts under different clinical guidelines and practice norms.
          - generic [ref=e541]:
            - generic [ref=e542]: RC-3
            - generic [ref=e543]:
              - generic [ref=e544]: Federated Evaluation Architecture
              - paragraph [ref=e545]: Independent per-site deployment with statistical-only data sharing under HIPAA and PIPL compliance.
    - generic [ref=e546]: Relationship to HealthBench
    - generic [ref=e547]:
      - paragraph [ref=e548]: "HealthBench (OpenAI, 2025) and TRUST-Med: Complementary Approaches"
      - paragraph [ref=e549]: "HealthBench established a rigorous rubric-based standard: 5,000 scenarios, 262 physicians across 60 countries, 48,562 physician-authored criteria. TRUST-Med builds on this foundation while addressing three structural gaps."
