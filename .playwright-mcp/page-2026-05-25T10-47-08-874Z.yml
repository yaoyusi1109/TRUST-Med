    - generic [ref=e577]: Three Research Gaps We Address
    - generic [ref=e578]:
      - generic [ref=e579]:
        - generic [ref=e580]: "01"
        - heading "Benchmarks Test the Wrong Thing" [level=3] [ref=e581]
        - paragraph [ref=e582]: Over 60% of real clinical queries involve treatment decisions, documentation, and patient communication — not the fact-recall questions that dominate existing benchmarks.
      - generic [ref=e583]:
        - generic [ref=e584]: "02"
        - heading "No Cross-Jurisdiction Evidence" [level=3] [ref=e585]
        - paragraph [ref=e586]: All existing platforms are single-site and single-language. TRUST-Med is the first platform designed to measure and model cross-jurisdiction preference divergence.
      - generic [ref=e587]:
        - generic [ref=e588]: "03"
        - heading "Safety Collapsed into a Single Vote" [level=3] [ref=e589]
        - paragraph [ref=e590]: Single-preference buttons aggregate everything into one signal. Inspired by HealthBench's rubric approach, TRUST-Med uses five physician-grounded dimensions.
