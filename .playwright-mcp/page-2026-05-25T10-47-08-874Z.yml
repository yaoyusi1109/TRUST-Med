    - generic [ref=e592]:
      - generic [ref=e593]:
        - generic [ref=e594]: Step 01
        - heading "Query Submission" [level=4] [ref=e595]
        - paragraph [ref=e596]: Practicing clinicians submit real de-identified clinical queries from their daily workflow.
      - generic [ref=e597]:
        - generic [ref=e598]: Step 02
        - heading "Anonymous Response Pair" [level=4] [ref=e599]
        - paragraph [ref=e600]: Two randomly sampled AI systems generate anonymized responses (Model α / β).
      - generic [ref=e601]:
        - generic [ref=e602]: Step 03
        - heading "Five-Dimension Rating" [level=4] [ref=e603]
        - paragraph [ref=e604]: Clinician rates each response on five dimensions plus an overall preference.
      - generic [ref=e605]:
        - generic [ref=e606]: Step 04
